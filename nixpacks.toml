# Nixpacks configuration for Railway
# Dual runtime: Python 3 (FastAPI) + Node.js 22 (Express + Vite build)

[phases.setup]
nixPkgs = ["python314", "nodejs_22", "npm-10_x", "gcc", "file"]

[phases.install]
cmds = [
  "pip install -r backend/requirements.txt",
  "npm ci"
]

[phases.build]
cmds = ["npm run build"]

[start]
cmd = "bash start.sh"
